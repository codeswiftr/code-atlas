[project]
name = "code-atlas"
version = "0.1.0"
description = "Pipeline that converts Claude Code sessions into a searchable knowledge graph."
readme = "README.md"
authors = [
    { name = "Bogdan Veliscu", email = "bogdan.veliscu@outlook.com" }
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "anthropic>=0.30.0",
    "fastapi>=0.115.0",
    "httpx>=0.26.0",
    "litellm>=1.0.0",
    "pathspec>=0.12.1",
    "prometheus-client>=0.21.0",
    "psutil>=6.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.12.0",
    "rich>=14.0.0",
    "redis>=5.0.0",
    "structlog>=24.1.0",
    "typer>=0.12.5",
    "uvicorn>=0.32.0",
    "numpy>=2.3.5",
    "sentence-transformers>=5.2.0",
    "mcp>=1.25.0",
    "alembic>=1.17.2",
    "forge-shared>=0.1.0",
    "posthog>=3.0.0",
]

[tool.uv.sources]
forge-shared = { path = "../../../forge-shared", editable = true }

[project.scripts]
code-atlas = "code_atlas.cli:app"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q --maxfail=1"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require external services (FalkorDB, Redis, etc.)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.4",
]
