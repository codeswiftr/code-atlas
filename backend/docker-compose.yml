# Code Atlas Development Docker Compose
# ======================================
# Start with: docker compose up -d
# Or use: make docker-up (from project root)

version: "3.9"

services:
  # FalkorDB - Graph Database (Redis-compatible)
  falkordb:
    image: falkordb/falkordb:latest
    container_name: code-atlas-falkordb
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - falkordb_data:/data
    environment:
      - REDIS_ARGS=--save 60 1 --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Redis - For caching and rate limiting (separate from FalkorDB)
  redis:
    image: redis:7-alpine
    container_name: code-atlas-redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  falkordb_data:
    driver: local
