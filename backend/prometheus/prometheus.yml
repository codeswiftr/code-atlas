# Prometheus configuration for Code Atlas
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: 'code-atlas'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # Uncomment to enable Alertmanager:
          # - alertmanager:9093

# Load alerting rules
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # Code Atlas API metrics
  - job_name: 'code-atlas-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

