# Alerting rules for Code Atlas
groups:
  - name: code_atlas_alerts
    interval: 30s
    rules:
      # High error rate alert
      - alert: HighErrorRate
        expr: |
          rate(code_atlas_pipeline_extraction_failures_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      # Cost threshold exceeded
      - alert: CostThresholdExceeded
        expr: |
          increase(code_atlas_pipeline_cost_usd_total[1d]) > 50
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Daily cost threshold exceeded"
          description: "Daily cost has exceeded $50 (current: ${{ $value }})"

      # API latency degradation
      - alert: HighAPILatency
        expr: |
          histogram_quantile(0.95, rate(code_atlas_api_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API latency degradation"
          description: "95th percentile API latency is {{ $value }}s (threshold: 1s)"

      # System resource exhaustion
      - alert: HighCPUUsage
        expr: |
          rate(process_cpu_seconds_total[5m]) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}% (threshold: 80%)"

      - alert: HighMemoryUsage
        expr: |
          (process_resident_memory_bytes / 1024 / 1024 / 1024) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}GB (threshold: 2GB)"

      # Service down
      - alert: ServiceDown
        expr: |
          up{job="code-atlas-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Code Atlas API is down"
          description: "Code Atlas API service has been down for more than 1 minute"

