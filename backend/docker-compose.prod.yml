version: "3.9"

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: code-atlas-falkordb
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"  # Bind to localhost only for security
    volumes:
      - falkordb_data:/data
    environment:
      - REDIS_ARGS=--save 60 1 --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  falkordb_data:
    driver: local

