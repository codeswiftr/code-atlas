# Railway Configuration for Code Atlas Backend
# https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Railway injects $PORT - use it in startCommand
startCommand = "python -m code_atlas.cli serve --host 0.0.0.0 --port $PORT"
