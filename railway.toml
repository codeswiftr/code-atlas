# Railway Configuration for Code Atlas Backend
# https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
startPeriod = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Railway injects PORT env var - use uvicorn directly
startCommand = "sh -c 'echo Starting Code Atlas on port $PORT && uvicorn code_atlas.api.main:app --host 0.0.0.0 --port $PORT'"
